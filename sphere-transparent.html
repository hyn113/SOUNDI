<title>soundi · Transparent orb</title>
<style>
*{box-sizing:border-box}html{color-scheme:light;--bg:#fff;--ink:#23222a;--muted:#8a8793;--border:#ecebf0;--panel:#faf9fc;--accent:#9561dc}html[data-theme=dark]{color-scheme:dark;--bg:#101016;--ink:#f4f1fa;--muted:#9893a6;--border:#2c2836;--panel:#18151f;--accent:#c7a0ff}body{margin:0;background:var(--bg);color:var(--ink);font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{height:76px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}.brand{font-size:20px;letter-spacing:-1px}.edition{font-size:10px;letter-spacing:2px;color:var(--muted);margin-left:20px}button,a,input,select{font:inherit}button{cursor:pointer;color:inherit;background:transparent;border:1px solid var(--border);border-radius:24px;padding:9px 15px}button:hover{border-color:var(--accent)}button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}a{color:var(--muted);text-decoration:none}header nav{display:flex;align-items:center;gap:18px}main{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:calc(100svh - 76px)}.stage{display:flex;align-items:center;justify-content:center;flex-direction:column;padding:40px 24px;min-width:0}.orb{width:min(280px,65vw,64svh);aspect-ratio:1}.mood-sphere-canvas{display:block;width:100%;height:100%;pointer-events:none}h1{font-size:21px;font-weight:500;letter-spacing:-.7px;margin:8px 0 12px}.caption{max-width:360px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8;margin:0}.actions{display:flex;gap:8px;margin-top:22px}.controls{border-left:1px solid var(--border);padding:28px 24px;background:var(--panel)}fieldset{border:0;margin:0 0 27px;padding:0}legend{font-size:12px;font-weight:600;padding:0;margin-bottom:15px}.presets,.shapes{display:flex;gap:6px;flex-wrap:wrap}.presets button,.shapes button{font-size:11px;padding:7px 11px}.row{display:flex;justify-content:space-between;align-items:center;margin:17px 0 8px}.row label{font-size:12px}.row output{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}input[type=range]{width:100%;height:3px;accent-color:var(--accent);display:block;margin:9px 0 20px}select{color:inherit;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:5px 8px}.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:14px}input[type=color]{border:0;width:100%;height:34px;cursor:pointer;padding:0;background:transparent}.note{font-size:11px;color:var(--muted);line-height:1.8}.credit{margin-top:20px;border-top:1px solid var(--border);padding-top:16px;font-size:10px;color:var(--muted);line-height:1.8}.error{color:#bf4e70;max-width:350px;line-height:1.8}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}@media(max-width:760px){header{padding:0 18px;height:66px}.edition{margin-left:10px;font-size:8px}header nav{gap:10px}main{grid-template-columns:1fr}.stage{padding:24px 16px 34px}.orb{width:min(88vw,280px)}.controls{border-left:0;border-top:1px solid var(--border);padding:25px}.controls form{max-width:460px;margin:auto}.caption{font-size:11px}}
</style>

<body>
<header><div><span class="brand">soundi</span><span class="edition">TRANSPARENT / 01</span></div><nav><a href="backups/inner-zero-20260922/sphere-inner-zero.html">이전 버전</a><a href="/">작곡 화면</a><button id="theme" type="button" aria-pressed="false">다크 배경</button></nav></header>
<main>
<section class="stage"><div class="orb" id="orb" aria-hidden="true"></div><p id="error" class="error" hidden></p><h1>색이 흐르는 작은 세계</h1><p class="caption">색이 머무는 부분만 보이고, 빈 곳은 배경이 비치는 구.<br>여기서는 색과 움직임을 직접 조절할 수 있어요.</p><div class="actions"><button id="pause" aria-pressed="false" type="button">움직임 멈추기</button><button id="reset" type="button">처음으로</button></div></section>
<aside class="controls" aria-label="구 스타일 조절"><form id="controls" onsubmit="return false">
<fieldset><legend>색상</legend><div class="presets" id="palettes"><button type="button" data-palette="smooth" aria-pressed="true">아쿠아</button><button type="button" data-palette="aurora" aria-pressed="false">오로라</button><button type="button" data-palette="coral" aria-pressed="false">코랄</button><button type="button" data-palette="opal" aria-pressed="false">오팔</button></div><div class="row"><label for="colorCount">색상 개수</label><select id="colorCount"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></div><div class="swatches" id="swatches"></div></fieldset>
<fieldset><legend>윤곽 움직임</legend><div class="shapes" id="shapes"><button type="button" data-shape="round" aria-pressed="true">원형</button><button type="button" data-shape="soft" aria-pressed="false">잔잔한</button><button type="button" data-shape="fluid" aria-pressed="false">유동적인</button><button type="button" data-shape="lively" aria-pressed="false">생동감</button></div><div id="contourSliders"></div></fieldset>
<fieldset><legend>색의 흐름과 표면</legend><div id="surfaceSliders"></div></fieldset>
<p class="note">이 화면의 설정은 미리보기용이에요. 작곡 화면에서는 곡 분석값에 따라 색과 움직임이 변합니다.</p>
